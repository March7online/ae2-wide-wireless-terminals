plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}
        server { args '--nogui' }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'org.appliedenergistics'
        }
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    flatDir {
        dirs file(System.getenv('AE2WTLIB_DIR') ?: "${projectDir}/local-mods"),
                file("${projectDir}/work/runtime-mods")
    }
}

def localModsDir = file(System.getenv('AE2WTLIB_DIR') ?: "${projectDir}/local-mods")
def ae2wtlibJar = file(localModsDir.path +
        "/ae2wtlib-${ae2wtlib_version}-forge.jar")
if (!ae2wtlibJar.exists()) {
    throw new GradleException(
            'Set AE2WTLIB_DIR or place ae2wtlib-15.3.3-forge.jar in local-mods')
}

def runtimeMods = [
        [fileName: 'architectury-9.2.14-forge.jar', dependency: 'blank:architectury:9.2.14-forge'],
        [fileName: 'cloth-config-11.1.136-forge.jar', dependency: 'blank:cloth-config:11.1.136-forge'],
        [fileName: 'curios-forge-5.14.1+1.20.1.jar', dependency: 'blank:curios-forge:5.14.1+1.20.1'],
        [fileName: 'guideme-20.1.14.jar', dependency: 'blank:guideme:20.1.14'],
        [fileName: 'jei-1.20.1-forge-15.20.0.129.jar', dependency: 'blank:jei:1.20.1-forge-15.20.0.129'],
        [
                fileName: 'IMBlocker-4.0.5+1.20.jar',
                sourceFileName: 'IMBlocker_4.0.5+1.20.jar',
                dependency: 'blank:IMBlocker:4.0.5+1.20'
        ]
]
def availableRuntimeMods = runtimeMods.findAll { runtimeMod ->
    def sourcePattern = runtimeMod.sourceFileNamePattern ?: runtimeMod.fileName
    def runtimeJar = runtimeMod.sourceFileName
            ? file(localModsDir.path + "/${runtimeMod.sourceFileName}")
            : (fileTree(localModsDir).matching { include sourcePattern }.files ?: [file(localModsDir.path + "/${sourcePattern}")]).first()
    if (runtimeJar.exists() && (runtimeMod.sourceFileNamePattern || runtimeMod.sourceFileName)) {
        def runtimeAlias = file("${projectDir}/work/runtime-mods/${runtimeMod.fileName}")
        runtimeAlias.parentFile.mkdirs()
        if (!runtimeAlias.exists() || runtimeAlias.length() != runtimeJar.length()) {
            runtimeAlias.bytes = runtimeJar.bytes
        }
    }
    return runtimeJar.exists()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    implementation fg.deobf("blank:ae2wtlib:${ae2wtlib_version}-forge")
    availableRuntimeMods.each { runtimeMod ->
        runtimeOnly fg.deobf(runtimeMod.dependency)
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.tomlj:tomlj:1.1.1'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            ae2_version            : ae2_version,
            ae2wtlib_version       : ae2wtlib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    dependsOn tasks.named('processResources')
    useJUnitPlatform()
}
